<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>UrbanFlow AI</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b0f14;
  color: #e5e7eb;
}

/* TITLE */
h2 {
  text-align: center;
  padding: 18px;
  font-size: 26px;
  font-weight: 600;
  color: #e5e7eb;
}

/* LAYOUT */
.container {
  display: flex;
  gap: 20px;
  padding: 20px;
}

/* CARDS (CLEAN, NO EFFECTS) */
.card {
  background: #111827;
  border: 1px solid #1f2937;
  padding: 20px;
  border-radius: 8px;
  flex: 1;
}

/* INPUTS */
input, select {
  width: 100%;
  padding: 10px;
  margin: 6px 0;
  border-radius: 6px;
  border: 1px solid #374151;
  background: #0b0f14;
  color: #e5e7eb;
  outline: none;
}

input:focus, select:focus {
  border: 1px solid #4b5563;
}

/* BUTTON */
button {
  width: 100%;
  padding: 11px;
  background: #16a34a; /* emerald green */
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-weight: 600;
  color: white;
  margin-top: 10px;
}

button:hover {
  background: #15803d;
}

/* RESULT BOX */
.result {
  margin-top: 15px;
  font-size: 16px;
  padding: 12px;
  background: #0f172a;
  border: 1px solid #1f2937;
  border-radius: 6px;
  line-height: 1.5;
}

/* INSIGHT */
.insight {
  margin-top: 10px;
  padding: 10px;
  background: #111827;
  border-left: 3px solid #f59e0b; /* amber highlight */
  border-radius: 6px;
}

/* CHART */
canvas {
  margin-top: 20px;
}

/* RESPONSIVE */
@media (max-width: 900px) {
  .container {
    flex-direction: column;
  }
}
</style>

</head>

<body>

<h2 style="text-align:center; padding:10px;">🚦 UrbanFlow AI Dashboard</h2>

<div class="container">

  <!-- INPUT PANEL -->
  <div class="card">
    <h3>Traffic Input</h3>

    <input id="hour" type="number" placeholder="Hour (0-23)">
    <input id="day" type="number" placeholder="Day of Week (0-6)">
    <input id="vehicle" type="number" placeholder="Vehicle Count">

    <select id="weather">
      <option value="0">Clear</option>
      <option value="1">Rain</option>
      <option value="2">Fog</option>
    </select>

    <select id="accident">
      <option value="0">No Accident</option>
      <option value="1">Accident</option>
    </select>

    <select id="road">
      <option value="0">Normal Road</option>
      <option value="1">Highway</option>
    </select>

    <select id="event">
      <option value="0">No Event</option>
      <option value="1">Event</option>
    </select>

    <button onclick="predictTraffic()">Predict Traffic</button>

    <div class="result" id="result"></div>
  </div>

  <!-- ANALYTICS PANEL -->
  <div class="card">
    <h3>Traffic Analytics</h3>
    <canvas id="chart"></canvas>
  </div>

</div>

<script>
let trafficChart; // store chart instance globally

async function predictTraffic() {

  try {

    // ----------------------------
    // COLLECT INPUT DATA
    // ----------------------------
    const data = {
      hour: Number(document.getElementById("hour").value),
      day_of_week: Number(document.getElementById("day").value),
      vehicle_count: Number(document.getElementById("vehicle").value),
      weather: Number(document.getElementById("weather").value),
      accident: Number(document.getElementById("accident").value),
      road_type: Number(document.getElementById("road").value),
      event: Number(document.getElementById("event").value)
    };

    // ----------------------------
    // CALL BACKEND API
    // ----------------------------
    const response = await fetch("http://127.0.0.1:5000/predict", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data)
    });

    const result = await response.json();

    // ----------------------------
    // AI INSIGHT LOGIC
    // ----------------------------
    let insightText = "";

    if (result.predicted_congestion > 70) {
      insightText = "High congestion expected. Avoid peak hours (6–9 PM).";
    } else if (result.predicted_congestion > 40) {
      insightText = "Moderate traffic. Slight delays possible.";
    } else {
      insightText = "Low traffic. Smooth travel expected.";
    }

    // ----------------------------
    // UPDATE UI
    // ----------------------------
    document.getElementById("result").innerHTML = `
      🚦 Congestion: ${result.predicted_congestion.toFixed(2)}% <br>
      📍 Cluster: ${result.traffic_cluster}
      <div class="insight">
        🧠 AI Insight:<br>
        ${insightText}
      </div>
    `;

    // ----------------------------
    // UPDATE CHART
    // ----------------------------
    drawChart(result.predicted_congestion);

  } catch (error) {
    console.error("Error:", error);
    document.getElementById("result").innerHTML =
      "❌ Error connecting to server. Make sure backend is running.";
  }
}

// ----------------------------
// CHART FUNCTION (NO DUPLICATES)
// ----------------------------
function drawChart(value) {

  const ctx = document.getElementById('chart');

  // destroy old chart if exists
  if (trafficChart) {
    trafficChart.destroy();
  }

  trafficChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: ['Morning', 'Afternoon', 'Evening', 'Night'],
      datasets: [{
        label: 'Traffic Trend Simulation',
        data: [
          value * 0.6,
          value * 0.8,
          value,
          value * 0.5
        ],
        borderColor: '#38bdf8',
        tension: 0.4,
        fill: true
      }]
    },
    options: {
      responsive: true,
      plugins: {
        legend: {
          labels: { color: 'white' }
        }
      },
      scales: {
        x: { ticks: { color: 'white' } },
        y: { ticks: { color: 'white' } }
      }
    }
  });
}
</script>
<canvas id="bgCanvas"></canvas>
</body>
</html>
